name: Auto Publish to Firefox
on:
  workflow_run:
    workflows: ["Auto Release on Commit"]
    types:
      - completed
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  firefox-publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    
    steps:
      - name: Check conditions
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_run' && context.payload.workflow_run.conclusion !== 'success') {
              console.log("Main release workflow did not complete successfully. Skipping.");
              core.setOutput('skip', 'true');
              return;
            }

            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'firefox-release.yml',
              status: 'success',
              per_page: 1
            });
            
            let lastRunDate = new Date(0);
            if (runs.workflow_runs.length > 0) {
              lastRunDate = new Date(runs.workflow_runs[0].updated_at);
            }
            
            let latestRelease;
            try {
              const { data: release } = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              latestRelease = release;
            } catch (e) {
              console.log("No releases found.");
              core.setOutput('skip', 'true');
              return;
            }
            
            const releaseDate = new Date(latestRelease.published_at);
            
            if (context.eventName !== 'workflow_dispatch' && releaseDate <= lastRunDate) {
              console.log("No new release since last firefox publish. Skipping.");
              core.setOutput('skip', 'true');
              return;
            }
            
            console.log(`Conditions met. Proceeding with publish for tag ${latestRelease.tag_name}.`);
            core.setOutput('skip', 'false');
            core.setOutput('tag_name', latestRelease.tag_name);

      - name: Download extension zip
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download ${{ steps.check.outputs.tag_name }} -p "simple-url-redirector-firefox-unsigned.zip" --repo ${{ github.repository }}

      - name: Publish to Mozilla Add-ons
        if: steps.check.outputs.skip == 'false'
        uses: wdzeng/firefox-addon@v1
        with:
          addon-guid: 'simple-url-redirector@gamerjagdish.com'
          xpi-path: simple-url-redirector-firefox-unsigned.zip
          jwt-issuer: ${{ secrets.FIREFOX_API_KEY }}
          jwt-secret: ${{ secrets.FIREFOX_API_SECRET }}
