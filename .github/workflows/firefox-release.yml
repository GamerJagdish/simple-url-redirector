name: Auto Publish to Firefox
on:
  workflow_run:
    workflows: ["Auto Release on Commit"]
    types:
      - completed
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  firefox-publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    
    steps:
      - name: Check conditions
        id: check
        uses: actions/github-script@v9
        with:
          script: |
            if (context.eventName === 'workflow_run' && context.payload.workflow_run.conclusion !== 'success') {
              console.log("Main release workflow did not complete successfully. Skipping.");
              core.setOutput('skip', 'true');
              return;
            }

            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'firefox-release.yml',
              status: 'success',
              per_page: 1
            });
            
            let lastRunDate = new Date(0);
            if (runs.workflow_runs.length > 0) {
              lastRunDate = new Date(runs.workflow_runs[0].updated_at);
            }
            
            let latestRelease;
            try {
              const { data: release } = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              latestRelease = release;
            } catch (e) {
              console.log("No releases found.");
              core.setOutput('skip', 'true');
              return;
            }
            
            const releaseDate = new Date(latestRelease.published_at);
            
            if (context.eventName !== 'workflow_dispatch' && releaseDate <= lastRunDate) {
              console.log("No new release since last firefox publish. Skipping.");
              core.setOutput('skip', 'true');
              return;
            }
            
            console.log(`Conditions met. Proceeding with publish for tag ${latestRelease.tag_name}.`);
            core.setOutput('skip', 'false');
            core.setOutput('tag_name', latestRelease.tag_name);

      - name: Download extension zip
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download ${{ steps.check.outputs.tag_name }} -p "simple-url-redirector-firefox-unsigned.zip" --repo ${{ github.repository }}

      - name: Publish to Mozilla Add-ons
        if: steps.check.outputs.skip == 'false'
        uses: wdzeng/firefox-addon@v1
        with:
          addon-guid: 'simple-url-redirector@gamerjagdish.com'
          xpi-path: simple-url-redirector-firefox-unsigned.zip
          jwt-issuer: ${{ secrets.FIREFOX_API_KEY }}
          jwt-secret: ${{ secrets.FIREFOX_API_SECRET }}

      - name: Fetch Signed Assets from Mozilla & Attach to GitHub Release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching signed extension from Mozilla Add-ons API..."
          
          XPI_URL=""
          for i in {1..12}; do
            RESPONSE=$(curl -s "https://addons.mozilla.org/api/v5/addons/addon/simple-url-redirect/")
            URL=$(echo "$RESPONSE" | jq -r '.current_version.file.url // empty')
            if [ -n "$URL" ]; then
              XPI_URL="$URL"
              echo "Found signed XPI URL: $XPI_URL"
              break
            fi
            echo "Attempt $i: Signed XPI URL not available yet. Retrying in 10s..."
            sleep 10
          done

          if [ -z "$XPI_URL" ]; then
            echo "Error: Could not retrieve signed XPI URL from Mozilla Add-ons API."
            exit 1
          fi

          echo "Downloading signed XPI..."
          curl -sL "$XPI_URL" -o "simple-url-redirector-firefox-signed.xpi"
          cp "simple-url-redirector-firefox-signed.xpi" "simple-url-redirector-firefox-signed.zip"

          echo "Uploading signed assets (.xpi and .zip) to GitHub Release ${{ steps.check.outputs.tag_name }}..."
          gh release upload ${{ steps.check.outputs.tag_name }} \
            "simple-url-redirector-firefox-signed.xpi" \
            "simple-url-redirector-firefox-signed.zip" \
            --clobber \
            --repo ${{ github.repository }}
